name: Test de regression complet

on:
  workflow_dispatch:      # declenchement manuel depuis l'onglet Actions
  push:
    branches: [main]      # ou seulement sur main, pas toutes les branches

jobs:
  full-pipeline-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Créer le fichier .env depuis les secrets
        run: echo "${{ secrets.ENV_FILE }}" > .env

      - name: Lancer la stack complete
        run: docker compose up -d --build

      - name: Attendre que les services soient prets
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && break
            sleep 5
          done

      - name: Telecharger le modele Ollama
        run: docker compose exec -T ollama ollama pull llama3.1

      - name: Installer les dependances du benchmark
        run: pip install requests mlflow

      - name: Lancer le benchmark avec seuil de regression
        run: python mlops_docling.py --engine docling --fail-under 75

      - name: Recuperer les resultats en artefact (meme en cas d'echec)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark_results/

      - name: Arreter la stack
        if: always()
        run: docker compose down