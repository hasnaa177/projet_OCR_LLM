  #     # GROQ_API_KEY doit être défini dans le fichier .env
  #     # GROQ_MODEL peut être surchargé ici (défaut : llama-3.1-70b-versatile)
  #   command: uvicorn main_groq:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
  minio_data:
  ollama_data: